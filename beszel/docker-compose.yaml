# Service monitor
services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      APP_URL: http://127.0.0.1:8090
      CONTAINER_DETAILS: false
    ports:
      - 8090:8090
    volumes:
      - /mnt/cache/container/appdata/beszel/data:/beszel_data
    networks:
      - container-share-net
    healthcheck:
          test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
          interval: 2m
          timeout: 10s
          retries: 3
          start_period: 30s
          start_interval: 5s

  # Security proxy that filters Docker APIs
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1 # Allow reading of containers
      - INFO=1       # Allow reading of Docker basic info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:23750:2375"
    networks:
      - container-share-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:2375/_ping || exit 1"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 5s

  # Agent
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host 
    privileged: true
    depends_on:
      - docker-proxy
    volumes:
      - /mnt/cache/container/appdata/beszel/agent:/var/lib/beszel-agent
    environment:
      TOKEN: ${TOKEN}
      KEY: ${KEY}
      PORT: 45876
      HUB_URL: http://127.0.0.1:8090
      DOCKER_HOST: tcp://127.0.0.1:23750
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 5s

networks:
  container-share-net:
    external: true